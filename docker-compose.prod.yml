services:
  postgres:
    container_name: portfolio-postgres
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: portfolio-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: portfolio-backend
    build:
      context: ./backend
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DEMOS_ROOT=/app/demos
    volumes:
      - ${DEMOS_HOST_ROOT:-./demos}/published:/app/demos/published:ro
      - ${DEMOS_HOST_ROOT:-./demos}/config:/app/demos/config:ro
      - ${DEMOS_HOST_ROOT:-./demos}/staging:/app/demos/staging:ro
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
      - ./fixtures:/app/fixtures:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; h=(os.environ.get('NGINX_SERVER_NAMES') or 'localhost').split()[0]; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host':h,'X-Forwarded-Proto':'https'}), timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  celery:
    container_name: portfolio-celery
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    volumes:
      - backend_logs:/app/logs
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Without this, a worker that cannot reach the broker still counts as a
      # successful deploy and contact notifications fail silently.
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  frontend:
    container_name: portfolio-frontend
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_TITLE: ${NEXT_PUBLIC_SITE_TITLE:-Portfolio}
        NEXT_PUBLIC_REVALIDATE: ${NEXT_PUBLIC_REVALIDATE:-0}
        PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
    env_file: .env
    environment:
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-t1", "-T5", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s

  nginx:
    container_name: portfolio-nginx
    image: nginx:alpine
    env_file: .env
    environment:
      DEMOS_BASE_DOMAIN: ${DEMOS_BASE_DOMAIN:-example.com}
      NGINX_PROXY_SCHEME: ${NGINX_PROXY_SCHEME:-auto}
      NGINX_TRUSTED_PROXY: ${NGINX_TRUSTED_PROXY:-127.0.0.1}
      DEMOS_AUTH_HOST: ${DEMOS_AUTH_HOST:-localhost}
      DEMOS_GATE_SECRET: ${DEMOS_GATE_SECRET:-}
      NGINX_BACKEND: portfolio-backend:8000
      NGINX_FRONTEND: portfolio-frontend:3000
    ports:
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/demos.conf:/etc/nginx/templates/demos.conf.template:ro
      - ${DEMOS_HOST_ROOT:-./demos}/published:/demos/published:ro
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
    networks:
      - demo_edge
      - default
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  backend_static:
  backend_media:
  backend_logs:

networks:
  demo_edge:
    name: portfolio_demo_edge
