# nginx upstream is templated by ACTIVE_COLOR so blue-green flips happen
# by writing a new value to .env and recreating the nginx container.
#
# Variable-based proxy_pass + the Docker DNS resolver means nginx does NOT
# validate the upstream hostname at startup — it resolves on each request.
# This lets nginx come up cleanly even before any app colour is running,
# which matters for fresh deploys where infra starts first.

resolver 127.0.0.11 ipv6=off valid=10s;

# Drop requests for unknown hosts.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ${NGINX_SERVER_NAMES};
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    set $backend  "portfolio-${ACTIVE_COLOR}-backend:8000";
    set $frontend "portfolio-${ACTIVE_COLOR}-frontend:3000";

    # Backend API
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media files
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
