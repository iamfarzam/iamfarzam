# nginx upstream is templated by ACTIVE_COLOR so blue-green flips happen
# by writing a new value to .env and recreating the nginx container.
#
# Variable-based proxy_pass + the Docker DNS resolver means nginx does NOT
# validate the upstream hostname at startup — it resolves on each request.
# This lets nginx come up cleanly even before any app colour is running,
# which matters for fresh deploys where infra starts first.

resolver 127.0.0.11 ipv6=off valid=10s;

# Trust only the configured TLS proxy peer, then replace downstream IP headers.
set_real_ip_from ${NGINX_TRUSTED_PROXY};
# Cloudflare edge ranges, verified 2026-09-28 against the official lists:
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
# Preserve individual visitor addresses when Cloudflare connects directly.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Set https explicitly when this HTTP listener sits behind a trusted TLS proxy.
# Do not trust visitor-supplied X-Forwarded-Proto headers on a public listener.
map "${NGINX_PROXY_SCHEME}" $portfolio_proxy_scheme {
    default $scheme;
    https https;
    http http;
}

# Drop requests for unknown hosts.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ${NGINX_SERVER_NAMES};
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    set $backend  "${NGINX_BACKEND}";
    set $frontend "${NGINX_FRONTEND}";

    # Backend API
    location = /healthz/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $portfolio_proxy_scheme;
    }

    location /internal/ {
        return 404;
    }

    location = /frontend-healthz/ {
        proxy_pass http://$frontend/healthz;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $portfolio_proxy_scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $portfolio_proxy_scheme;
    }

    # Django static files
    location /static/ {
        alias /static/;
        # Django assets are not all content-hashed; allow updates to be fetched.
        expires 1h;
        add_header Cache-Control "public";
    }

    # Django media files
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $portfolio_proxy_scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
