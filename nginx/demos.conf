# Requests are gated before any static file, API, or WebSocket is accessible.
# First-level demo-<project> hosts work with standard wildcard/Cloudflare TLS.
limit_req_zone $binary_remote_addr zone=portfolio_demos:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_demo_connections:10m;
map $http_upgrade $demo_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name ~^demo-(?<demo_slug>[a-z0-9][a-z0-9-]*)\.${DEMOS_BASE_DOMAIN}$;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $demo_backend "${NGINX_BACKEND}";
    set $demo_host $host;
    set $demo_uri $request_uri;
    set $demo_method $request_method;
    set $demo_accept $http_accept;
    root /demos;
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    autoindex off;
    disable_symlinks on;
    client_max_body_size 2m;
    limit_req zone=portfolio_demos burst=100 nodelay;
    limit_req_status 429;
    limit_conn portfolio_demo_connections 20;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src $demo_script_policy; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location = /__demo_authorize {
        internal;
        proxy_pass http://$demo_backend/internal/demos/authorize/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Host ${DEMOS_AUTH_HOST};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Demo-Gate "${DEMOS_GATE_SECRET}";
        proxy_set_header X-Demo-Host $demo_host;
        proxy_set_header X-Demo-URI $demo_uri;
        proxy_set_header X-Demo-Method $demo_method;
        proxy_set_header X-Demo-Accept $demo_accept;
        proxy_set_header X-Demo-Probe $http_x_demo_probe;
        proxy_set_header X-Demo-Service $http_x_demo_service;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        auth_request /__demo_authorize;
        auth_request_set $demo_file $upstream_http_x_demo_file;
        auth_request_set $demo_upstream $upstream_http_x_demo_upstream;
        auth_request_set $demo_script_policy $upstream_http_x_demo_script_policy;
        error_page 401 403 =404 @demo_unavailable;
        try_files $demo_file @demo_service;
    }

    location @demo_service {
        # Only the authenticated gate can supply this operator-registered upstream.
        proxy_pass $demo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $demo_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Demo-Gate "";
        proxy_set_header X-Demo-Probe "";
        proxy_set_header X-Demo-Service "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $demo_connection;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_cookie_domain ~.* $demo_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location @demo_unavailable {
        return 404;
    }
}
